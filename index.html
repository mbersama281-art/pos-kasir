<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Warung Stok</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f1f5f4;color:#12201e;padding-left:68px}
header{background:#0f766e;color:#fff;padding:14px 16px;font-weight:700;font-size:18px;position:sticky;top:0;z-index:5}
main{padding:12px;max-width:640px;margin:auto}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:#64748b;font-size:13px}
.badge{padding:3px 9px;border-radius:99px;font-weight:700;font-size:13px;background:#d1fae5;color:#065f46;white-space:nowrap}
.badge.low{background:#fee2e2;color:#991b1b}
button,.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;background:#0f766e;color:#fff;cursor:pointer}
button.alt{background:#e2e8f0;color:#12201e}
button.red{background:#dc2626}
button.sm{padding:7px 11px;font-size:14px}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;margin-top:4px}
label{font-size:13px;color:#475569;display:block;margin-top:10px}
nav{position:fixed;top:0;left:0;bottom:0;width:68px;background:#fff;display:flex;flex-direction:column;align-items:stretch;gap:4px;border-right:1px solid #e2e8f0;padding:10px 4px;z-index:6}
nav button{background:none;color:#64748b;border-radius:10px;padding:12px 0;font-size:11px;font-weight:600}
nav button.on{color:#0f766e;background:#ecfdf5}
nav span{display:block;font-size:22px;margin-bottom:2px}
@media(min-width:700px){body{padding-left:120px}nav{width:120px;padding:14px 10px}nav button{font-size:14px;padding:14px 0}nav span{font-size:26px}}
dialog{border:0;border-radius:14px;width:92%;max-width:440px;padding:16px}
dialog::backdrop{background:#0008}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:22px;font-weight:800}
.hide{display:none}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#12201e;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;display:none;max-width:90%}
.scanbtn{display:block;text-align:center;padding:22px;font-size:18px}
</style>
</head>
<body>
<header>🏪 Warung Stok</header>
<div id="toast"></div>
<main>
  <section id="tab-beranda"><div id="beranda"></div></section>

  <section id="tab-pesanan" class="hide">
    <div class="row" style="margin-bottom:10px"><b>Pesanan ke gudang</b><button class="sm" onclick="openOrd()">+ Pesanan</button></div>
    <div id="ordList"></div>
  </section>

  <section id="tab-kasir" class="hide">
    <div class="row" style="gap:8px;margin-bottom:10px"><button id="mOut" style="flex:1" onclick="setMode('out')">⬆ Keluar (jual)</button><button id="mIn" style="flex:1" onclick="setMode('in')">⬇ Masuk (restok)</button></div>
    <div class="card">
      <label style="margin:0">Scan / ketik kode barcode lalu Enter (alat scan USB juga bisa)</label>
      <input id="kcode" inputmode="numeric" placeholder="Arahkan alat scan di sini..." onkeydown="if(event.key==='Enter'){addCode(this.value);this.value=''}">
      <button class="alt sm" id="kcambtn" style="margin-top:8px" onclick="toggleCam()">📷 Buka kamera</button>
      <video id="kvideo" class="hide" playsinline muted style="width:100%;border-radius:10px;margin-top:8px"></video>
    </div>
    <div id="kcart"></div>
    <div class="card"><div class="row"><b id="ktotal"></b><button onclick="selesaiKasir()">✔ Selesai</button></div></div>
  </section>

  <section id="tab-stok" class="hide">
    <input id="cari" placeholder="🔍 Cari barang..." oninput="renderStok()">
    <div class="row" style="margin:10px 0"><span class="muted" id="ringkas"></span>
      <button class="sm" onclick="openForm()">+ Barang</button></div>
    <div id="list"></div>
  </section>

  <section id="tab-scan" class="hide">
    <div class="card">
      <b>Scan barang pakai foto</b>
      <p class="muted">Foto barangnya (bungkus/kemasan), AI akan menebak nama barangnya. Kamu tinggal cek lalu simpan.</p>
      <label class="btn scanbtn">📷 Ambil Foto
        <input type="file" accept="image/*" capture="environment" class="hide" onchange="scanFoto(this)">
      </label>
      <p id="scanStatus" class="muted"></p>
    </div>
    <div id="scanHasil"></div>
  </section>

  <section id="tab-lap" class="hide">
    <div id="laporan"></div>
  </section>
</main>

<nav>
  <button onclick="openCari()"><span>🔎</span>Cari</button>
  <button data-t="beranda" class="on" onclick="tab('beranda')"><span>🏠</span>Beranda</button>
  <button data-t="pesanan" onclick="tab('pesanan')"><span>🧾</span>Pesanan</button>
  <button data-t="kasir" onclick="tab('kasir')"><span>🛒</span>Kasir</button>
  <button data-t="stok" onclick="tab('stok')"><span>📦</span>Stok</button>
  <button data-t="scan" onclick="tab('scan')"><span>📷</span>Scan</button>
  <button data-t="lap" onclick="tab('lap')"><span>📊</span>Laporan</button>
</nav>

<dialog id="dlgCari">
  <input id="cq" placeholder="Cari halaman: stok, pesanan, laporan..." oninput="renderCari()" onkeydown="if(event.key==='Enter'){const f=cariList()[0];if(f){dlgCari.close();tab(f.k)}}">
  <div id="hasilCari" style="margin-top:8px"></div>
  <div style="text-align:right;margin-top:10px"><button class="alt sm" onclick="dlgCari.close()">Tutup</button></div>
</dialog>

<dialog id="dlgOrd">
  <b>Pesanan ke gudang</b>
  <label>Nama gudang / supplier<input id="o_nama" placeholder="contoh: Gudang Pak Haji"></label>
  <label>Catatan (opsional)<input id="o_cat" placeholder="contoh: kirim hari Senin"></label>
  <label>Barang yang dipesan</label>
  <div id="ordLines"></div>
  <button class="alt sm" style="margin-top:8px" onclick="addLine()">+ Tambah barang</button>
  <div style="text-align:right;margin-top:14px"><button class="alt" onclick="dlgOrd.close()">Batal</button> <button onclick="simpanOrd()">Simpan</button></div>
</dialog>

<dialog id="dlgAssign">
  <b>Barcode baru: <span id="asKode"></span></b>
  <p class="muted">Kode ini belum terdaftar. Ini barcode untuk barang yang mana?</p>
  <label>Barang<select id="asItem"></select></label>
  <label>Ini barcode untuk<select id="asUnit"><option value="satuan">Satuan (per bungkus/pcs)</option><option value="dus">Dus / kemasan besar</option></select></label>
  <div style="text-align:right;margin-top:14px"><button class="alt" onclick="dlgAssign.close()">Batal</button> <button onclick="simpanAssign()">Simpan &amp; tambahkan</button></div>
</dialog>

<dialog id="dlg">
  <b id="dlgTitle">Barang</b>
  <label>Nama barang<input id="f_nama"></label>
  <div class="grid2">
    <label>Satuan kecil<select id="f_satuan"><option>pcs</option><option>bungkus</option><option>botol</option><option>renteng</option><option>kg</option><option>liter</option><option>dus</option></select></label>
    <label>Isi per dus (kosongkan kalau tidak ada dus)<input id="f_isi" type="number" inputmode="numeric" oninput="hitungBeli()"></label>
    <label>Harga beli per dus<input id="f_beliDus" type="number" inputmode="numeric" oninput="hitungBeli()"></label>
    <label>Harga beli per satuan<input id="f_beli" type="number" inputmode="numeric"></label>
    <label>Harga jual per satuan<input id="f_jual" type="number" inputmode="numeric"></label>
    <label>Harga jual per dus<input id="f_jualDus" type="number" inputmode="numeric"></label>
    <label>Barcode satuan<input id="f_kode" inputmode="numeric"></label>
    <label>Barcode dus<input id="f_kodeDus" inputmode="numeric"></label>
    <label>Stok (dalam satuan kecil)<input id="f_stok" type="number" inputmode="numeric"></label>
    <label>Batas stok menipis<input id="f_min" type="number" inputmode="numeric" placeholder="contoh: 5"></label>
  </div>
  <p class="muted" id="f_hint"></p>
  <div class="row" style="margin-top:14px">
    <button class="red sm" id="btnDel" onclick="hapus()">Hapus</button>
    <span><button class="alt" onclick="dlg.close()">Batal</button> <button onclick="simpan()">Simpan</button></span>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + (Math.round(n) || 0).toLocaleString('id-ID');
let items = [], editId = null;
const dlg = $('dlg'), dlgCari = $('dlgCari'), dlgOrd = $('dlgOrd'), dlgAssign = $('dlgAssign');

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}

async function api(url, method='GET', body){
  const r = await fetch(url,{method,headers:{'content-type':'application/json','x-pass':localStorage.pass||''},
    body: body?JSON.stringify(body):undefined});
  if(r.status===401){
    const p = prompt('Masukkan password aplikasi:');
    if(p){localStorage.pass=p;return api(url,method,body)}
    throw new Error('Butuh password');
  }
  const j = await r.json();
  if(!r.ok) throw new Error(j.error||'Error');
  return j;
}

const PAGES=[{k:'beranda',n:'Beranda',w:'home ringkasan'},{k:'pesanan',n:'Pesanan',w:'order gudang supplier kulakan restok datang'},{k:'kasir',n:'Kasir scan',w:'scan barcode jual keluar masuk restok'},{k:'stok',n:'Stok',w:'barang gudang'},{k:'scan',n:'Scan foto',w:'kamera foto barcode'},{k:'lap',n:'Laporan',w:'untung penjualan omzet'}];
function tab(n){
  PAGES.forEach(p=>$('tab-'+p.k).classList.toggle('hide',p.k!==n));
  document.querySelectorAll('nav button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===n));
  if(n!=='kasir') stopCam();
  if(n==='kasir') loadKasir();
  if(n==='lap') loadLap();
  if(n==='beranda') loadBeranda();
  if(n==='pesanan') loadPesanan();
}
function cariList(){const q=$('cq').value.toLowerCase();return PAGES.filter(p=>(p.n+' '+p.w).toLowerCase().includes(q))}
function renderCari(){
  $('hasilCari').innerHTML=cariList().map(p=>`<button class="alt" style="width:100%;text-align:left;margin-top:6px" onclick="dlgCari.close();tab('${p.k}')">${p.n}</button>`).join('')||'<p class="muted">Tidak ketemu.</p>';
}
function openCari(){$('cq').value='';renderCari();dlgCari.showModal();$('cq').focus()}

async function loadBeranda(){
  try{
    const [r,it,od]=await Promise.all([api('/api/report'),api('/api/items'),api('/api/orders')]);
    items=it;
    const low=it.filter(i=>i.stok<=i.min), baru=od.filter(o=>o.status==='baru'&&o.gudang);
    $('beranda').innerHTML=`
      <div class="card"><div class="muted">Untung hari ini</div><div class="big">${rp(r.hariIni.untung)}</div>
        <div class="muted">Omzet ${rp(r.hariIni.omzet)} • ${r.hariIni.terjual} barang terjual</div></div>
      <div class="card"><div class="row"><div><div class="muted">Pesanan gudang belum datang</div><div class="big">${baru.length}</div></div>
        <button class="sm" onclick="tab('pesanan')">Lihat</button></div></div>
      <div class="card"><b>⚠️ Stok hampir habis (${low.length})</b>
        ${low.slice(0,6).map(i=>`<div class="row" style="margin-top:8px"><span>${esc(i.nama)}</span><span class="badge low">${stokTxt(i)}</span></div>`).join('')||'<p class="muted">Aman, belum ada yang menipis.</p>'}</div>
      <div class="row" style="gap:8px"><button style="flex:1" onclick="tab('stok')">📦 Stok</button><button style="flex:1" onclick="tab('scan')">📷 Scan</button></div>`;
  }catch(e){toast(e.message)}
}

let kMode='out', cart=[], cam=null, camTimer=null, lastCode='', lastT=0, pendingCode='';
async function loadKasir(){
  try{items=await api('/api/items');renderKasir()}catch(e){toast(e.message)}
  setTimeout(()=>$('kcode').focus(),150);
}
function setMode(m){kMode=m;renderKasir()}
function hargaUnit(it,u){
  if(kMode==='out') return u==='dus'?(it.jualDus||it.jual*it.isi):it.jual;
  return u==='dus'?(it.beliDus||it.beli*it.isi):it.beli;
}
function addCode(c){
  c=String(c).trim(); if(!c||dlgAssign.open) return;
  for(const it of items){
    if(it.kode===c) return addCart(it.id,'satuan',1);
    if(it.kodeDus===c) return addCart(it.id,'dus',1);
  }
  pendingCode=c; $('asKode').textContent=c;
  $('asItem').innerHTML=items.map(i=>`<option value="${i.id}">${esc(i.nama)}</option>`).join('');
  dlgAssign.showModal();
}
async function simpanAssign(){
  const it=items.find(i=>i.id===$('asItem').value), u=$('asUnit').value;
  if(!it){toast('Pilih barang');return}
  if(u==='dus'&&!(it.isi>0)){toast('Isi per dus barang ini belum diisi. Edit barangnya dulu.');return}
  try{
    await api('/api/items/'+it.id,'PUT',u==='dus'?{kodeDus:pendingCode}:{kode:pendingCode});
    items=await api('/api/items'); dlgAssign.close(); addCart(it.id,u,1);
  }catch(e){toast(e.message)}
}
function addCart(id,unit,q){
  const l=cart.find(x=>x.itemId===id&&x.unit===unit);
  if(l) l.qty+=q; else cart.push({itemId:id,unit,qty:q});
  if(navigator.vibrate) navigator.vibrate(40);
  renderKasir();
}
function renderKasir(){
  $('mOut').className=kMode==='out'?'':'alt'; $('mIn').className=kMode==='in'?'':'alt';
  let total=0;
  $('kcart').innerHTML=cart.map((l,idx)=>{
    const it=items.find(i=>i.id===l.itemId); if(!it) return '';
    const h=hargaUnit(it,l.unit); total+=h*l.qty;
    return `<div class="card"><div class="row"><div><b>${esc(it.nama)}</b><div class="muted">${l.unit==='dus'?'per dus (isi '+it.isi+')':'per '+esc(it.satuan)} • ${rp(h)}</div></div>
      <div class="row"><input type="number" inputmode="numeric" min="1" value="${l.qty}" style="width:80px;margin:0" onchange="cart[${idx}].qty=Math.max(0,+this.value||0);renderKasir()">
      <button class="sm red" onclick="cart.splice(${idx},1);renderKasir()">✕</button></div></div></div>`;
  }).join('')||'<p class="muted" style="text-align:center">Belum ada barang. Scan barcode untuk mulai.</p>';
  $('ktotal').textContent=(kMode==='out'?'Total jual: ':'Total modal: ')+rp(total);
}
async function selesaiKasir(){
  const lines=cart.filter(l=>l.qty>0);
  if(!lines.length){toast('Daftar masih kosong');return}
  try{
    await api('/api/checkout','POST',{type:kMode,lines});
    toast(kMode==='out'?'Penjualan tercatat ✅':'Stok masuk tercatat ✅'); cart=[]; loadKasir();
  }catch(e){toast(e.message)}
}
async function toggleCam(){
  if(cam){stopCam();return}
  if(!('BarcodeDetector' in window)){toast('Browser ini belum mendukung scan kamera. Pakai Chrome Android, atau alat scan barcode.');return}
  try{
    cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('kvideo'); v.srcObject=cam; v.classList.remove('hide'); await v.play();
    const det=new BarcodeDetector();
    camTimer=setInterval(async()=>{
      try{
        const r=await det.detect(v);
        if(r[0]&&(r[0].rawValue!==lastCode||Date.now()-lastT>2000)){lastCode=r[0].rawValue;lastT=Date.now();addCode(lastCode)}
      }catch(e){}
    },350);
    $('kcambtn').textContent='⏹ Tutup kamera';
  }catch(e){cam=null;toast('Kamera tidak bisa dibuka: '+e.message)}
}
function stopCam(){
  if(camTimer){clearInterval(camTimer);camTimer=null}
  if(cam){cam.getTracks().forEach(t=>t.stop());cam=null}
  const v=$('kvideo'); if(v) v.classList.add('hide');
  const b=$('kcambtn'); if(b) b.textContent='📷 Buka kamera';
}

let orders=[];
async function loadPesanan(){
  try{orders=await api('/api/orders');items=await api('/api/items');renderOrd()}catch(e){toast(e.message)}
}
function renderOrd(){
  const sorted=orders.slice().sort((a,b)=>(a.status==='baru'?0:1)-(b.status==='baru'?0:1));
  $('ordList').innerHTML=sorted.map(o=>{
    const total=o.lines.reduce((a,l)=>a+(l.harga||0)*l.qty,0);
    return `<div class="card"><div class="row"><b>${esc(o.nama)}</b><span class="badge ${o.status==='baru'?'low':''}">${o.status==='baru'?'Dipesan':'Sudah datang'}</span></div>
      <div class="muted">${new Date(o.t).toLocaleDateString('id-ID')}</div>
      <div style="margin-top:6px">${o.lines.map(l=>`${l.qty} ${l.unit==='dus'?'dus':esc(l.satuan)} ${esc(l.nama)}`).join('<br>')}</div>
      ${o.catatan?`<div class="muted" style="margin-top:6px">📝 ${esc(o.catatan)}</div>`:''}
      ${total?`<div class="muted" style="margin-top:6px">Perkiraan modal ${rp(total)}</div>`:''}
      <div class="row" style="margin-top:10px">
        <span>${o.status==='baru'?`<button class="sm" onclick="selesaiOrd('${o.id}')">✔ Barang sudah datang</button>`:''}</span>
        <button class="sm red" onclick="hapusOrd('${o.id}')">Hapus</button></div></div>`;
  }).join('')||'<p class="muted" style="text-align:center">Belum ada pesanan ke gudang.</p>';
}
function unitOpts(it){return `<option value="satuan">${esc(it.satuan)}</option>${it.isi>0?`<option value="dus">dus (isi ${it.isi})</option>`:''}`}
function openOrd(){
  $('o_nama').value='';$('o_cat').value='';$('ordLines').innerHTML='';
  if(!items.length){toast('Isi data stok barang dulu');return}
  addLine();dlgOrd.showModal();
}
function addLine(){
  const d=document.createElement('div');d.className='row';d.style.marginTop='6px';
  d.innerHTML=`<select style="flex:3" onchange="gantiItem(this)">${items.map(i=>`<option value="${i.id}">${esc(i.nama)}</option>`).join('')}</select><input type="number" inputmode="numeric" min="1" value="1" style="flex:1"><select style="flex:2">${unitOpts(items[0])}</select>`;
  $('ordLines').appendChild(d);
}
function gantiItem(sel){const it=items.find(i=>i.id===sel.value);sel.parentNode.children[2].innerHTML=unitOpts(it)}
async function simpanOrd(){
  const lines=[...$('ordLines').children].map(d=>({itemId:d.children[0].value,qty:d.children[1].value,unit:d.children[2].value}));
  try{await api('/api/orders','POST',{nama:$('o_nama').value,catatan:$('o_cat').value,lines});dlgOrd.close();toast('Pesanan tersimpan ✅');loadPesanan()}
  catch(e){toast(e.message)}
}
async function selesaiOrd(id){
  if(!confirm('Barang sudah datang? Stok akan bertambah sesuai pesanan.')) return;
  try{await api('/api/orders/'+id+'/done','POST');toast('Stok bertambah ✅');loadPesanan()}catch(e){toast(e.message)}
}
async function hapusOrd(id){
  if(!confirm('Hapus pesanan ini?')) return;
  try{await api('/api/orders/'+id,'DELETE');loadPesanan()}catch(e){toast(e.message)}
}

async function load(){
  try{ items = await api('/api/items'); renderStok(); }catch(e){toast(e.message)}
}

function renderStok(){
  const q = $('cari').value.toLowerCase();
  const list = items.filter(i=>i.nama.toLowerCase().includes(q));
  const low = items.filter(i=>i.stok<=i.min).length;
  $('ringkas').textContent = items.length+' barang'+(low?' • ⚠️ '+low+' hampir habis':'');
  $('list').innerHTML = list.map(i=>`
    <div class="card">
      <div class="row">
        <div><b>${esc(i.nama)}</b><div class="muted">Jual ${rp(i.jual)}/${esc(i.satuan)}${i.isi>0?' • '+rp(i.jualDus||i.jual*i.isi)+'/dus':''} • Modal ${rp(i.beli)}</div></div>
        <span class="badge ${i.stok<=i.min?'low':''}">${stokTxt(i)}</span>
      </div>
      <div class="row" style="margin-top:10px">
        <span><button class="sm" onclick="gerak('${i.id}','out')">− Jual</button>
        <button class="sm alt" onclick="gerak('${i.id}','in')">+ Masuk</button></span>
        <button class="sm alt" onclick="openForm('${i.id}')">Edit</button>
      </div>
    </div>`).join('') || '<p class="muted" style="text-align:center">Belum ada barang. Tekan "+ Barang" atau pakai Scan.</p>';
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function gerak(id,type){
  const it=items.find(i=>i.id===id)||{satuan:'pcs',isi:0};
  const q=prompt((type==='out'?'Jual':'Masuk')+' berapa? (angka = per '+it.satuan+(it.isi>0?', tambah "d" untuk dus, mis. 2d':'')+')','1');
  if(!q) return;
  const m=String(q).trim().match(/^(\d+(?:[.,]\d+)?)\s*(d|dus)?$/i);
  if(!m){toast('Format salah');return}
  try{ await api('/api/items/'+id+'/move','POST',{type,qty:m[1].replace(',','.'),unit:m[2]?'dus':'satuan'}); toast(type==='out'?'Tercatat terjual ✅':'Stok bertambah ✅'); load(); }
  catch(e){toast(e.message)}
}
function stokTxt(i){
  let t=i.stok+' '+i.satuan;
  if(i.isi>0){const d=Math.floor(i.stok/i.isi),r=i.stok%i.isi;t+=' ('+d+' dus'+(r?' + '+r:'')+')'}
  return t;
}

function openForm(id, pre){
  editId = id||null;
  const it = id ? items.find(i=>i.id===id) : (pre||{});
  $('dlgTitle').textContent = id?'Edit barang':'Tambah barang';
  const set=(k,v)=>$('f_'+k).value=v==null||v===0?'':v;
  $('f_nama').value=it.nama||''; $('f_satuan').value=it.satuan||'pcs';
  ['isi','beliDus','beli','jual','jualDus','kode','kodeDus','min'].forEach(k=>set(k,it[k]));
  $('f_stok').value = it.stok??'';
  $('btnDel').style.display = id?'':'none';
  hitungBeli(); dlg.showModal();
}
function hitungBeli(){
  const isi=+$('f_isi').value, bd=+$('f_beliDus').value;
  if(isi>0&&bd>0) $('f_beli').value=Math.round(bd/isi);
  $('f_hint').textContent=isi>0?'1 dus = '+isi+' '+$('f_satuan').value+'. Scan barcode dus akan menambah/mengurangi '+isi+' sekaligus.':'';
}
async function simpan(){
  const body={}; ['nama','satuan','isi','beliDus','beli','jual','jualDus','kode','kodeDus','stok','min'].forEach(k=>body[k]=$('f_'+k).value);
  try{
    await api(editId?'/api/items/'+editId:'/api/items',editId?'PUT':'POST',body);
    dlg.close(); toast('Tersimpan ✅'); load();
  }catch(e){toast(e.message)}
}
async function hapus(){
  if(!confirm('Hapus barang ini?')) return;
  await api('/api/items/'+editId,'DELETE'); dlg.close(); load();
}

// Perkecil foto biar upload cepat & hemat kuota
function resize(file,max=1024){
  return new Promise((ok,err)=>{
    const img=new Image(); img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=img.width*s; c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      ok(c.toDataURL('image/jpeg',0.8));
    }; img.onerror=err; img.src=URL.createObjectURL(file);
  });
}

async function scanFoto(inp){
  const f = inp.files[0]; if(!f) return;
  $('scanStatus').textContent='⏳ AI lagi mengenali barang...'; $('scanHasil').innerHTML='';
  try{
    const image = await resize(f);
    const r = await api('/api/scan','POST',{image});
    $('scanStatus').textContent='';
    if(!r.nama){ $('scanHasil').innerHTML='<div class="card">Barang tidak dikenali. Coba foto lebih dekat dan terang.</div>'; return; }
    window._scan = r;
    $('scanHasil').innerHTML = `<div class="card">
      <div class="muted">Terdeteksi (keyakinan: ${esc(r.yakin||'-')})</div>
      <div class="big">${esc(r.nama)}</div>
      ${r.match?`<p>✅ Sudah ada di stok: <b>${esc(r.match.nama)}</b> (sisa ${r.match.stok} ${esc(r.match.satuan)})</p>
        <button onclick="gerak('${r.match.id}','in')">+ Tambah stok</button>
        <button class="alt" onclick="gerak('${r.match.id}','out')">− Jual</button>`
      :`<p class="muted">Belum ada di stok.</p><button onclick="barangBaru()">+ Simpan sebagai barang baru</button>`}
    </div>`;
  }catch(e){ $('scanStatus').textContent=''; toast(e.message); }
  inp.value='';
}
function barangBaru(){
  const r=window._scan; tab('stok');
  openForm(null,{nama:r.nama,satuan:r.satuan||'pcs'});
}

async function loadLap(){
  try{
    const r = await api('/api/report');
    $('laporan').innerHTML = `
      <div class="card"><div class="muted">Hari ini</div>
        <div class="big">${rp(r.hariIni.untung)} <span class="muted">untung</span></div>
        <div class="muted">Omzet ${rp(r.hariIni.omzet)} • ${r.hariIni.terjual} barang terjual</div></div>
      <div class="card"><div class="muted">7 hari terakhir</div>
        <div class="big">${rp(r.mingguIni.untung)} <span class="muted">untung</span></div>
        <div class="muted">Omzet ${rp(r.mingguIni.omzet)}</div></div>
      <div class="card"><div class="muted">Nilai modal di stok</div><div class="big">${rp(r.nilaiStok)}</div></div>
      <div class="card"><b>🔥 Paling laku (7 hari)</b>
        ${r.terlaris.map((t,i)=>`<div class="row" style="margin-top:8px"><span>${i+1}. ${esc(t.nama)}</span><b>${t.qty}</b></div>`).join('')||'<p class="muted">Belum ada penjualan.</p>'}
      </div>`;
  }catch(e){toast(e.message)}
}
load();
loadBeranda();
</script>
